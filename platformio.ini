; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-zero

[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf

monitor_speed = 115200

board_build.flash_size = 4MB
board_upload.flash_size = 4MB

[env:esp32-s3-zero-unit-tests]
extends = env:esp32-s3-zero
board_build.esp-idf.sdkconfig_path = sdkconfig.unit-tests
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.unit-tests.defaults"

[env:esp32-s3-zero-hardware-tests]
extends = env:esp32-s3-zero
board_build.esp-idf.sdkconfig_path = sdkconfig.hardware-tests
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hardware-tests.defaults"

[env:esp32-s3-zero-hbridge-tests]
extends = env:esp32-s3-zero
board_build.esp-idf.sdkconfig_path = sdkconfig.hbridge-tests
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hbridge-tests.defaults"

